services:
  - type: web
    name: sofochat-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist/pjsofonic-connect-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
