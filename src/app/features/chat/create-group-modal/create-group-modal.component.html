<div class="modal-backdrop" (click)="closeModal.emit()">
  <div class="modal-card glass-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-title">
        <span class="material-symbols-rounded icon-purple">group_add</span>
        <h3>Create New Team Group</h3>
      </div>
      <button class="icon-btn" (click)="closeModal.emit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Group Name *</label>
        <input type="text" [(ngModel)]="groupName" placeholder="e.g. Frontend Architecture Team" class="glass-input" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="groupDescription" placeholder="Purpose of this group..." class="glass-input" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>Add EMS Verified Agents ({{ selectedMemberIds().length }} selected)</label>
        <div class="member-selection-list">
          <div *ngFor="let contact of chat.contacts()" 
               class="member-select-item" 
               [class.selected]="isMemberSelected(contact.id)"
               (click)="toggleMember(contact)">
            <img [src]="contact.avatarUrl" class="member-avatar" />
            <div class="member-meta">
              <span class="member-name">{{ contact.fullName }}</span>
              <span class="member-desig">{{ contact.designation }} &bull; {{ contact.departmentName || 'General' }}</span>
            </div>
            <span class="material-symbols-rounded check-icon">
              {{ isMemberSelected(contact.id) ? 'check_circle' : 'radio_button_unchecked' }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="glass-btn" (click)="closeModal.emit()">Cancel</button>
      <button class="glow-btn" (click)="createGroup()" [disabled]="!groupName.trim() || isLoading()">
        <span *ngIf="!isLoading()">Create Group Channel</span>
        <span *ngIf="isLoading()">Creating...</span>
      </button>
    </div>
  </div>
</div>
